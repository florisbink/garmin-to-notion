name: Sync Garmin to Notion

on:
  schedule:
    - cron: '0 7-21/2 * * *' # Elke 2 uur, 8:00–22:00 NL (wintertijd), zodat de stappen van vandaag bijlopen
  workflow_dispatch:
    inputs:
      GARMIN_ACTIVITIES_FETCH_LIMIT:
        type: number
        default: 10
env:
  TZ: 'Europe/Amsterdam'
  UV_SKIP_WHEEL_FILENAME_CHECK: '1'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vernieuwde Garmin-token van de vorige run terugzetten (versleuteld in de Actions-cache).
      - name: Restore Garmin token
        uses: actions/cache/restore@v4
        with:
          path: .garmin-token.enc
          key: garmin-token-${{ github.run_id }}
          restore-keys: garmin-token-

      - name: Decrypt Garmin token
        env:
          TOKEN_KEY: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -f .garmin-token.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:TOKEN_KEY -in .garmin-token.enc -out "$HOME/.garmin_token.json" \
              && echo "Bewaarde token teruggezet." || { echo "Ontsleutelen mislukt, val terug op secret."; rm -f "$HOME/.garmin_token.json"; }
          else
            echo "Geen bewaarde token, gebruik GARMIN_AUTH_TOKEN."
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run script
        env:
          GARMIN_AUTH_TOKEN: ${{ secrets.GARMIN_AUTH_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_PR_DB_ID: ${{ secrets.NOTION_PR_DB_ID }}
          NOTION_STEPS_DB_ID: ${{ secrets.NOTION_STEPS_DB_ID }}
          NOTION_SLEEP_DB_ID: ${{ secrets.NOTION_SLEEP_DB_ID }}
          GARMIN_ACTIVITIES_FETCH_LIMIT: ${{ inputs.GARMIN_ACTIVITIES_FETCH_LIMIT || '10' }}
          TZ: 'Europe/Amsterdam'
        run: |
          uv run python -m src.workflows.garmin-activities
          uv run python -m src.workflows.personal-records
          uv run python -m src.workflows.daily-steps
          uv run python -m src.workflows.sleep-data

      # Vernieuwde token versleuteld bewaren voor de volgende run, ook als een stap faalde.
      - name: Encrypt Garmin token
        if: always()
        env:
          TOKEN_KEY: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -s "$HOME/.garmin_token.json" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:TOKEN_KEY -in "$HOME/.garmin_token.json" -out .garmin-token.enc
          fi

      - name: Save Garmin token
        if: always() && hashFiles('.garmin-token.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .garmin-token.enc
          key: garmin-token-${{ github.run_id }}
